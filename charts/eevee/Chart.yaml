apiVersion: v2
name: eevee
description: A Helm chart for eevee.bot ecosystem deployment
type: application
version: '1.0.0'
appVersion: '1.0.0'
dependencies:
  - name: operator
    repository: file://../operator
    version: '2.2.33'
    condition: operator.enabled
  - name: bot
    repository: file://../bot
    version: '1.0.8'
    condition: bot.enabled
