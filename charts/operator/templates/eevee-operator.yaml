apiVersion: v1
kind: Secret
metadata:
  name: eevee-operator-api-token
  labels:
    eevee.bot/operator: "true"
  {{- include "operator.labels" . | nindent 4 }}
stringData:
  token: {{ required "operatorApiToken.token is required" .Values.operatorApiToken.token
    | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eevee-operator-role
  labels:
    eevee.bot/operator: "true"
  {{- include "operator.labels" . | nindent 4 }}
rules:
# Core K8s resources managed by the operator in its namespace
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Apps resources
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - list
  - watch
# Batch resources
- apiGroups:
  - batch
  resources:
  - cronjobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Networking resources
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Coordination (leader election)
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# eevee.bot custom resources
- apiGroups:
  - eevee.bot
  resources:
  - botmodules
  - backupschedules
  - backuprestores
  - s3stores
  - ipcconfigs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eevee-operator-cluster-role
  labels:
    eevee.bot/operator: "true"
  {{- include "operator.labels" . | nindent 4 }}
rules:
# CRD access for installation checks and watching
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
# eevee.bot custom resources (needed for WATCH_OTHER_NAMESPACES)
- apiGroups:
  - eevee.bot
  resources:
  - botmodules
  - backupschedules
  - backuprestores
  - s3stores
  - ipcconfigs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Cluster discovery (read-only)
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  verbs:
  - get
  - list
  - watch
---
{{ if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "operator.serviceAccountName" . }}
  labels:
  {{- include "operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eevee-operator-role-binding
  labels:
    eevee.bot/operator: "true"
  {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eevee-operator-role
subjects:
- kind: ServiceAccount
  name: '{{ include "operator.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eevee-operator-cluster-role-binding
  labels:
    eevee.bot/operator: "true"
  {{- include "operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eevee-operator-cluster-role
subjects:
- kind: ServiceAccount
  name: '{{ include "operator.serviceAccountName" . }}'
  namespace: '{{ .Release.Namespace }}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eevee-operator
  labels:
    eevee.bot/operator: "true"
  {{- include "operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  revisionHistoryLimit: {{ .Values.operator.revisionHistoryLimit }}
  strategy:
    rollingUpdate:
      maxSurge: {{ .Values.operator.strategy.rollingUpdate.maxSurge | quote }}
      maxUnavailable: {{ .Values.operator.strategy.rollingUpdate.maxUnavailable | quote
        }}
    type: {{ .Values.operator.strategy.type | quote }}
  selector:
    matchLabels:
      eevee.bot/operator: "true"
    {{- include "operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        eevee.bot/operator: "true"
      {{- include "operator.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: true
      containers:
      - env:
        - name: KUBE_IN_CLUSTER_CONFIG
          value: {{ quote .Values.operator.operator.env.kubeInClusterConfig }}
        - name: WATCH_OTHER_NAMESPACES
          value: {{ quote .Values.operator.operator.env.watchOtherNamespaces }}
        - name: LOG_LEVEL
          value: {{ quote .Values.operator.operator.env.logLevel }}
        - name: HTTP_API_PORT
          value: {{ quote .Values.operator.operator.env.httpApiPort }}
        - name: EEVEE_OPERATOR_API_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: eevee-operator-api-token
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.operator.operator.image.repository }}:{{ .Values.operator.operator.image.tag
          | default .Chart.AppVersion }}
        imagePullPolicy: {{ .Values.operator.operator.imagePullPolicy }}
        name: operator
        ports:
        - containerPort: 9000
          name: http
          protocol: TCP
        resources: {{- toYaml .Values.operator.operator.resources | nindent 10 }}
        securityContext: {{- toYaml .Values.operator.operator.containerSecurityContext
          | nindent 10 }}
      dnsPolicy: ClusterFirst
      nodeSelector: {{- toYaml .Values.operator.nodeSelector | nindent 8 }}
      restartPolicy: Always
      securityContext: {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "operator.serviceAccountName" . }}
      setHostnameAsFQDN: false
      shareProcessNamespace: false
      terminationGracePeriodSeconds: 30
      tolerations: {{- toYaml .Values.operator.tolerations | nindent 8 }}
      topologySpreadConstraints: {{- toYaml .Values.operator.topologySpreadConstraints
        | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: eevee-eevee-operator-service
  labels:
  {{- include "operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.eeveeOperatorService.type }}
  selector:
    eevee.bot/operator: "true"
    {{- include "operator.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.eeveeOperatorService.ports | toYaml | nindent 2 }}
