{{- range .Values.botModules }}
---
apiVersion: eevee.bot/v1
kind: BotModule
metadata:
  name: {{ .name }}
  namespace: {{ include "eevee-bot.botNamespace" $ }}
  labels:
    {{- include "eevee-bot.labels" $ | nindent 4 }}
spec:
  moduleName: {{ required "spec.moduleName is required" .spec.moduleName | quote }}
  image: {{ required "spec.image is required" .spec.image | quote }}
  {{- with .spec.size }}
  size: {{ . }}
  {{- end }}
  {{- with .spec.imagePullPolicy }}
  imagePullPolicy: {{ . | quote }}
  {{- end }}
  {{- with .spec.metrics }}
  metrics: {{ . }}
  {{- end }}
  {{- with .spec.metricsPort }}
  metricsPort: {{ . }}
  {{- end }}
  {{- with .spec.ipcConfig }}
  ipcConfig: {{ . | quote }}
  {{- end }}
  {{- with .spec.volumeMountPath }}
  volumeMountPath: {{ . | quote }}
  {{- end }}
  {{- with .spec.moduleConfig }}
  moduleConfig: {{ . | quote }}
  {{- end }}
  {{- with .spec.mountOperatorApiToken }}
  mountOperatorApiToken: {{ . }}
  {{- end }}
  {{- with .spec.enabled }}
  enabled: {{ . }}
  {{- end }}
  {{- with .spec.persistentVolumeClaim }}
  persistentVolumeClaim:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.envSecret }}
  envSecret:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.livenessProbe }}
  livenessProbe:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.readinessProbe }}
  readinessProbe:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.startupProbe }}
  startupProbe:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.backupSchedule }}
  backupSchedule:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.bootstrapFromBackup }}
  bootstrapFromBackup:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .spec.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
